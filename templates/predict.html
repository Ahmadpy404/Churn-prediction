{% extends 'base.html' %}

{% block header_title %}Predict Customer Churn{% endblock %}

{% block content %}
<div class="prediction-container">
    <div class="form-card">
        <h3>Customer Details</h3>
        <p class="subtitle">Enter the customer's information to predict churn probability.</p>
        
        <form id="predictionForm" class="prediction-form">
            
            <div class="form-section">
                <h4>Demographics</h4>
                <div class="form-grid">
                    <div class="input-group">
                        <label for="gender">Gender</label>
                        <select id="gender" name="gender" required>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                        </select>
                    </div>
                    
                    <div class="input-group">
                        <label for="SeniorCitizen">Senior Citizen</label>
                        <select id="SeniorCitizen" name="SeniorCitizen" required>
                            <option value="0">No (0)</option>
                            <option value="1">Yes (1)</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label for="Partner">Partner</label>
                        <select id="Partner" name="Partner" required>
                            <option value="Yes">Yes</option>
                            <option value="No">No</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label for="Dependents">Dependents</label>
                        <select id="Dependents" name="Dependents" required>
                            <option value="Yes">Yes</option>
                            <option value="No">No</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="form-section">
                <h4>Account Info</h4>
                <div class="form-grid">
                    <div class="input-group">
                        <label for="tenure">Tenure (Months)</label>
                        <input type="number" id="tenure" name="tenure" min="0" value="12" required>
                    </div>
                    <div class="input-group">
                        <label for="Contract">Contract Type</label>
                        <select id="Contract" name="Contract" required>
                            <option value="Month-to-month">Month-to-month</option>
                            <option value="One year">One year</option>
                            <option value="Two year">Two year</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label for="PaperlessBilling">Paperless Billing</label>
                        <select id="PaperlessBilling" name="PaperlessBilling" required>
                            <option value="Yes">Yes</option>
                            <option value="No">No</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label for="PaymentMethod">Payment Method</label>
                        <select id="PaymentMethod" name="PaymentMethod" required>
                            <option value="Electronic check">Electronic check</option>
                            <option value="Mailed check">Mailed check</option>
                            <option value="Bank transfer (automatic)">Bank transfer (automatic)</option>
                            <option value="Credit card (automatic)">Credit card (automatic)</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label for="MonthlyCharges">Monthly Charges ($)</label>
                        <input type="number" step="0.01" id="MonthlyCharges" name="MonthlyCharges" min="0" value="50.00" required>
                    </div>
                    <div class="input-group">
                        <label for="TotalCharges">Total Charges ($)</label>
                        <input type="number" step="0.01" id="TotalCharges" name="TotalCharges" min="0" value="600.00" required>
                    </div>
                </div>
            </div>

            <div class="form-section">
                <h4>Services</h4>
                <div class="form-grid">
                    <div class="input-group">
                        <label for="PhoneService">Phone Service</label>
                        <select id="PhoneService" name="PhoneService" required>
                            <option value="Yes">Yes</option>
                            <option value="No">No</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label for="MultipleLines">Multiple Lines</label>
                        <select id="MultipleLines" name="MultipleLines" required>
                            <option value="No">No</option>
                            <option value="Yes">Yes</option>
                            <option value="No phone service">No phone service</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label for="InternetService">Internet Service</label>
                        <select id="InternetService" name="InternetService" required>
                            <option value="Fiber optic">Fiber optic</option>
                            <option value="DSL">DSL</option>
                            <option value="No">No</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label for="OnlineSecurity">Online Security</label>
                        <select id="OnlineSecurity" name="OnlineSecurity" required>
                            <option value="No">No</option>
                            <option value="Yes">Yes</option>
                            <option value="No internet service">No internet service</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label for="OnlineBackup">Online Backup</label>
                        <select id="OnlineBackup" name="OnlineBackup" required>
                            <option value="No">No</option>
                            <option value="Yes">Yes</option>
                            <option value="No internet service">No internet service</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label for="DeviceProtection">Device Protection</label>
                        <select id="DeviceProtection" name="DeviceProtection" required>
                            <option value="No">No</option>
                            <option value="Yes">Yes</option>
                            <option value="No internet service">No internet service</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label for="TechSupport">Tech Support</label>
                        <select id="TechSupport" name="TechSupport" required>
                            <option value="No">No</option>
                            <option value="Yes">Yes</option>
                            <option value="No internet service">No internet service</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label for="StreamingTV">Streaming TV</label>
                        <select id="StreamingTV" name="StreamingTV" required>
                            <option value="No">No</option>
                            <option value="Yes">Yes</option>
                            <option value="No internet service">No internet service</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label for="StreamingMovies">Streaming Movies</label>
                        <select id="StreamingMovies" name="StreamingMovies" required>
                            <option value="No">No</option>
                            <option value="Yes">Yes</option>
                            <option value="No internet service">No internet service</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-predict" id="predictBtn">
                    <span class="btn-text">Predict Churn</span>
                    <div class="loader" id="loader" style="display: none;"></div>
                </button>
            </div>
        </form>
    </div>
    
    <div class="result-card" id="resultCard" style="display: none;">
        <h3>Prediction Result</h3>
        <div class="result-content" id="resultContent">
            <!-- Dynamically populated -->
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById('predictionForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const btn = document.getElementById('predictBtn');
    const btnText = btn.querySelector('.btn-text');
    const loader = document.getElementById('loader');
    const resultCard = document.getElementById('resultCard');
    const resultContent = document.getElementById('resultContent');
    
    // UI state
    btn.disabled = true;
    btnText.style.display = 'none';
    loader.style.display = 'block';
    
    const formData = new FormData(this);
    
    try {
        const response = await fetch("{{ url_for('predict') }}", {
            method: 'POST',
            body: formData
        });
        
        const result = await response.json();
        
        if (result.error) {
            resultContent.innerHTML = `<div class="error-msg">Error: ${result.error}</div>`;
        } else {
            const isChurn = result.prediction === 'Yes';
            const riskClass = isChurn ? 'high-risk' : 'low-risk';
            const riskText = isChurn ? 'High Risk of Churn' : 'Low Risk of Churn';
            const icon = isChurn 
                ? '<svg fill="none" stroke="currentColor" viewBox="0 0 24 24" width="48" height="48"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>'
                : '<svg fill="none" stroke="currentColor" viewBox="0 0 24 24" width="48" height="48"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>';
            
            resultContent.innerHTML = `
                <div class="result-badge ${riskClass}">
                    ${icon}
                    <h4>${riskText}</h4>
                    <p>Churn Probability: <strong>${result.probability}%</strong></p>
                </div>
            `;
        }
        
        resultCard.style.display = 'block';
        // Scroll to result
        resultCard.scrollIntoView({ behavior: 'smooth' });
        
    } catch (err) {
        resultContent.innerHTML = `<div class="error-msg">Failed to connect to the server.</div>`;
        resultCard.style.display = 'block';
    } finally {
        // Reset UI
        btn.disabled = false;
        btnText.style.display = 'block';
        loader.style.display = 'none';
    }
});
</script>
{% endblock %}
